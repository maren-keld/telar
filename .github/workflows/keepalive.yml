name: Diagnóstico manual de API

# UptimeRobot es el único monitor periódico. Se quitó el cron de GitHub porque
# junto con el autosuspend de Neon (5 min) mantenía el compute despierto y
# duplicaba tráfico sin aportar cobertura adicional. Este workflow queda para
# diagnóstico manual si el servicio parece caído.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la API
        run: |
          URL="https://telar-api-aim8.onrender.com/api/health"
          # --max-time generoso: si estaba dormida, esta llamada es justamente
          # la que paga el arranque en frio. 200 es lo unico que cuenta.
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 180 "$URL" || echo 000)
            SECS=$(curl -s -o /dev/null -w '%{time_total}' --max-time 30 "$URL" 2>/dev/null || echo '?')
            if [ "$CODE" = "200" ]; then
              echo "✓ HTTP 200 — respuesta en caliente: ${SECS}s"
              cat /tmp/health.json
              exit 0
            fi
            echo "intento $attempt → HTTP $CODE"
            sleep 20
          done
          # Tres intentos de 180 s fallados no son "estaba dormida": es que la
          # API esta caida. Fallar aca convierte esto en un monitor gratis.
          echo "::error::La API no respondio 200 en tres intentos. Revisa Render."
          exit 1
