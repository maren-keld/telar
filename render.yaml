# Render Blueprint — suscripciones Plan Profesional
# Dashboard Render → New → Blueprint → conecta este repo
services:
  - type: web
    name: telar-api
    runtime: python
    rootDir: server
    # La base GeoIP (comuna del visitante) se baja en cada build: no está en git
    # y se publica una versión nueva cada mes. Si falla, la API arranca igual y
    # el panel muestra la comuna apagada.
    buildCommand: pip install -r requirements.txt && ./fetch-geoip.sh
    startCommand: gunicorn app:APP --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MP_ACCESS_TOKEN
        sync: false
      # Postgres gestionado (Neon). Sin esto se usa SQLite en disco efímero y
      # los contadores del funnel se pierden en cada reinicio del servicio.
      # Usa el host con -pooler para no abrir una conexión nueva por request.
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PLAN_AMOUNT_CLP
        value: "19990"
      # Contraseña del panel privado telarapp.cl/panel. Sin ella el panel queda apagado.
      - key: PANEL_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BACKEND_URL
        fromService:
          name: telar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
