name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 30 s que avisan el dia que main deja de poder compilar un release, en vez
  # del dia que necesitas publicar. Ver cabecera de check-release-ready.sh.
  release-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-release-ready.sh

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # src/js/ai-secrets.js esta gitignoreado y lo genera este script. Sin el,
      # ai-config.js no resuelve su import y caen 20 tests: es lo que dejo el CI
      # en rojo desde que se saco la clave del repo el 31 de julio. Sin
      # MISTRAL_API_KEY el script escribe la clave vacia, que es lo que quieren
      # los tests.
      - name: Generate AI secrets stub
        run: ./scripts/write-ai-secrets.sh

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build exige que exista el externalBin declarado en tauri.conf.json
      # antes de compilar. El binario real lo produce build-sidecar.sh con
      # PyInstaller, que aca costaria minutos y no aporta: `cargo test --lib`
      # nunca ejecuta el sidecar. Un archivo vacio basta para pasar la
      # validacion. El release si compila el sidecar de verdad.
      - name: Placeholder del sidecar (solo para tests unitarios)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/analyze_session-aarch64-apple-darwin
          chmod +x src-tauri/binaries/analyze_session-aarch64-apple-darwin

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
