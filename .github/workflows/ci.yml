name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            server/requirements-dev.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt -r server/requirements-dev.txt

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Subscription API tests
        run: python -m pytest -q server/tests python/tests

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

  rust-and-domain-qa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install NF analysis dependencies
        run: pip install -r python/requirements.txt

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Neurofeedback domain QA
        run: ./scripts/qa-nf.sh
