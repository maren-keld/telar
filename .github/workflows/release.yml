name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión SemVer (ej. 0.1.1)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python deps (sidecar)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy scipy

      - name: Restore clinical packs (release full)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}"
          BUNDLE="dist/telar-packs-bundle.tar.gz"
          mkdir -p dist packs src/packs
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "${{ github.repository }}" -p "telar-packs-bundle.tar.gz" -D dist || true
          fi
          if [[ -f "$BUNDLE" ]]; then
            tar -xzf "$BUNDLE" -C .
            echo "→ Packs clínicos restaurados desde release asset"
          elif [[ -d packs/clinical-shared ]]; then
            echo "→ Packs presentes en checkout (dev)"
          else
            echo "⚠ Sin packs clínicos — build solo con demo pack"
            cp src/packs/index.public.json src/packs/index.json 2>/dev/null || true
          fi
          if [[ -d packs/clinical-shared || -d src/packs/clinical-shared ]]; then
            for p in clinical-shared tdah-adulto trauma-regulacion; do
              if [[ -d "packs/$p" && ! -d "src/packs/$p" ]]; then
                cp -R "packs/$p" "src/packs/$p"
              fi
            done
            echo '{"packs":["clinical-shared","tdah-adulto","trauma-regulacion"]}' > src/packs/index.json
          fi

      - name: Build sidecar
        shell: bash
        run: ./scripts/build-sidecar.sh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          releaseName: Telar ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          releaseBody: |
            ## Telar — app completa con packs clínicos

            - **macOS (Apple Silicon):** `Telar-macos.zip`
            - **Windows 10/11:** `Telar-windows.exe`
            - Motor open source (AGPL): [código en GitHub](https://github.com/maren-keld/telar)
            - Packs clínicos incluidos en el instalador (no en el repo público)
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: Package macOS zip (nombre canónico)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Telar.app"
          ./scripts/sign-macos-app.sh "$APP"

      - name: Package Windows installer (nombre canónico)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: ./scripts/package-windows-installer.sh

      - name: Upload canonical assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            gh release upload "$TAG" dist/Telar-macos.zip --clobber
          else
            gh release upload "$TAG" dist/Telar-windows.exe --clobber
          fi
